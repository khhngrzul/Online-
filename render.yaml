databases:
  - name: campus-hub-db
    plan: free
    databaseName: campus_hub
    user: campus_hub

services:
  - type: web
    name: campus-hub-api
    runtime: python
    plan: free
    rootDir: auth_backend/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-hub-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://campus-hub-web.onrender.com

  - type: web
    name: campus-hub-web
    runtime: static
    buildCommand: bash render_build.sh
    staticPublishPath: build/web
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: campus-hub-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
